[pytest]
# Enable coverage reporting
addopts = --cov=. 
        --cov-report=term-missing
        --cov-fail-under=90

# Specify source directories for coverage
python_files = app.py test_app.py config.py

# Exclude __pycache__ and .pyc files from test discovery
norun = 
    */__pycache__/*
    *.pyc

# Minimum coverage threshold (90%)
minversion = 6.0