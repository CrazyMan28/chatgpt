// build.gradle
plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT'
    id 'java'
}

fabric-loom {
    version = '1.5-SNAPSHOT'
}

fabric-mod {
    modId = 'gemma_minecraftmodcd'
    version = '1.0.0'
    javaversion = JavaVersion.VERSION_21
}

dependencies {
    // Fabric API dependency
    modImplementation("net.fabricmc.fabric-api:fabric-api:0.15.11")
}